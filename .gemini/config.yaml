# Gemini Code Assist — the PRIMARY PR reviewer for contributing-clanker.
#
# Lane separation (no replicated work — each tool owns one thing):
#   • Security / SAST            → CodeQL        (.github/workflows/codeql.yml)
#   • Deterministic correctness  → CI gates      (shellcheck + bats + regression)
#   • Code review (logic/design) → Gemini        (this app) ← the workhorse
#
# Gemini reviews what the deterministic tools can't: design, logic, bash
# correctness pitfalls, maintainability, and AI-slop in skill prose. It must
# NOT re-report shellcheck-class lint or CodeQL-class security findings — see
# .gemini/styleguide.md.

have_fun: false

code_review:
  disable: false
  # Surface substantive issues; skip nits. The CI lint gate already catches style.
  comment_severity_threshold: MEDIUM
  # No cap — let the workhorse say what it needs to.
  max_review_comments: -1
  pull_request_opened:
    help: false
    summary: true
    code_review: true

# Don't spend review budget on code we don't own or no longer maintain.
ignore_patterns:
  - ".audit-harness/**"          # vendored upstream (@intentsolutions/audit-harness)
  - "99-archived-system-docs/**" # deprecated pre-2026-04-30 monorepo planning
  - "tools/node_modules/**"      # dependencies
  - "**/*.pdf"
  - ".beads/**"                  # bd state ledger, not reviewable code
